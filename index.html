<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Number Sequence Puzzles</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container">
    <h1>Number Sequence Puzzles</h1>

    <section class="controls">
      <label for="difficulty">Difficulty</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="newPuzzle">New Puzzle</button>
      <span id="score">Score: 0</span>
    </section>

    <section id="puzzleArea" class="puzzle-area">
      <div id="sequence" class="sequence">—</div>
      <div class="answer-row">
        <input id="answerInput" type="text" inputmode="numeric" placeholder="Type missing number" />
        <button id="submitAnswer">Submit</button>
      </div>
      <div id="feedback" class="feedback"></div>
    </section>

    <footer class="footer">
      <small>Sequence types: arithmetic, geometric, Fibonacci, squares, primes.</small>
    </footer>
  </main>

  <script src="js/game.js"></script>
</body>
</html>
